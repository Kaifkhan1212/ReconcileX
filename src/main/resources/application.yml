spring:
  application:
    name: reconcilex
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reconcilex_app}
    username: ${DB_USERNAME:reconcilex_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


reconcilex:
  matching:
    date-tolerance-days: 3
    service-charge-keywords:
      - charge
      - fee
      - maintenance
      - IMPS
      - SMS
      - mandate
      - POS
      - folio
      - "cheque book"
      - forex
    unexpected-debit-keywords:
      - chargeback
      - dispute
      - reversal
